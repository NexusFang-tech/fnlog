[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fnlog"
version = "0.1.0"
description = "FNLog — Fortnite Zero Build session tracker with vaporwave dashboard"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "textual>=0.52.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
fnlog = "fnlog.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fnlog*"]

[tool.setuptools.package-data]
fnlog = ["templates/*.html", "templates/static/*"]
