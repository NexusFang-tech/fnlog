name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff

      - name: Lint with ruff
        run: ruff check fnlog/ --ignore E501

      - name: Verify CLI registers correctly
        run: fnlog --help

      - name: Verify DB initializes
        run: python -c "from fnlog.db import init_db; init_db(); print('DB OK')"
        env:
          FNLOG_API_KEY: test
          FNLOG_EPIC_NAME: TestPlayer
